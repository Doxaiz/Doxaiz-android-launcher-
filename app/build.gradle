plugins {
    id 'com.android.application'
    // Профили (AUDIT §54): build-система кладёт baseline-prof.txt и
    // startup-prof.txt в APK, ART компилирует эти методы заранее.
    id 'androidx.baselineprofile'
}

android {
    namespace 'com.doxaiz.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.doxaiz.launcher"
        minSdk 26
        targetSdk 34
        // Нумерация начата заново с публичного релиза 1.0.0 (было 43 / 6.0-test).
        // versionCode обязан быть меньше следующего релиза и больше нуля;
        // сброс в 1 безопасен, пока публичного релиза не было.
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            // F-20: R8 был отключён без причины. Своей рефлексии по классам лаунчера
            // нет, поэтому сжатие безопасно. Отключить точечно: -PnoMinify
            minifyEnabled !project.hasProperty('noMinify')
            shrinkResources !project.hasProperty('noMinify')
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // BuildConfig нужен, чтобы замеры отзывчивости публиковались только в
    // debug-сборке (debug.doxaiz.filter_ms): в релизе лишний setprop не нужен.
    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        // F-18: наборы проверок из ../tests раньше не запускались ничем.
        test.java.srcDirs += '../tests'
        // Audit54Tests раньше исключался целиком: ему нужен настоящий org.json,
        // а в android.jar лежит заглушка, которая кидает RuntimeException в
        // конструкторе. Настоящая реализация подключена ниже, поэтому набор
        // больше не исключается — см. dependencies.testImplementation.
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

baselineProfile {
    // Профиль лежит в репозитории и попадает в сборку сразу: генерация — это
    // прогон на устройстве, она не должна быть условием обычной сборки.
    saveInSrc = true
    // AGP 8.2 не поддерживает отдельные профили на вариант — плагин сводит их.
    mergeIntoMain = true
    // Оптимизация раскладки DEX по startup-профилю.
    //
    // ВЫКЛЮЧЕНА, пока профиля нет в репозитории. С включённым флагом R8 падает
    // на :app:minifyReleaseWithR8: «Dex optimization based on startup profile
    // has been turned on ... but there are no input baseline profile found».
    // Порядок обязателен: сначала сгенерировать профиль на устройстве
    // (:app:generateReleaseBaselineProfile), затем включить флаг. Обратный
    // порядок ломает release-сборку — проверено в прогоне 45686563422.
    dexLayoutOptimization = false
}

dependencies {
    // ProfileInstaller: доставляет профиль на устройстве (Android 12+ умеет сам,
    // но profileinstaller нужен как зависимость для сборки профиля).
    implementation 'androidx.profileinstaller:profileinstaller:1.3.1'
    baselineProfile project(':baselineprofile')
    // Без сторонних зависимостей в рантайме — минимальный размер APK и мгновенный отклик.
    testImplementation 'junit:junit:4.13.2'
    // F-18: настоящий org.json для JVM-тестов. В APK он не попадает — это
    // testImplementation, а на устройстве работает системная реализация.
    // Без него Audit54Tests (BackupHelper.validateDesktopJson и проверки
    // импорта) приходилось исключать из сборки, то есть самая рискованная
    // часть бэкапа оставалась без регрессии.
    testImplementation 'org.json:json:20240303'
}

tasks.withType(Test).configureEach {
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}
