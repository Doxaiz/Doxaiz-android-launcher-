plugins {
    id 'com.android.application'
}

android {
    namespace 'com.doxaiz.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.doxaiz.launcher"
        minSdk 26
        targetSdk 34
        versionCode 38
        versionName "5.5-test"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Без сторонних зависимостей — минимальный размер APK и мгновенный отклик
}
