plugins {
    id 'com.android.application'
    // Профили (AUDIT §54): build-система кладёт baseline-prof.txt и
    // startup-prof.txt в APK, ART компилирует эти методы заранее.
    id 'androidx.baselineprofile'
}

android {
    namespace 'com.doxaiz.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.doxaiz.launcher"
        minSdk 26
        targetSdk 34
        // Публичное обновление после 1.0.0: Android видит versionCode 2.
        // Для следующих публикаций versionCode должен строго увеличиваться.
        versionCode 2
        versionName "1.0.1"
    }

    buildTypes {
        release {
            // F-20: R8 был отключён без причины. Своей рефлексии по классам лаунчера
            // нет, поэтому сжатие безопасно. Отключить точечно: -PnoMinify
            minifyEnabled !project.hasProperty('noMinify')
            shrinkResources !project.hasProperty('noMinify')
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // BuildConfig нужен, чтобы замеры отзывчивости публиковались только в
    // debug-сборке (debug.doxaiz.filter_ms): в релизе лишний setprop не нужен.
    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        // F-18: наборы проверок из ../tests раньше не запускались ничем.
        test.java.srcDirs += '../tests'
        // Audit54Tests раньше исключался целиком: ему нужен настоящий org.json,
        // а в android.jar лежит заглушка, которая кидает RuntimeException в
        // конструкторе. Настоящая реализация подключена ниже, поэтому набор
        // больше не исключается — см. dependencies.testImplementation.
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

// Для AGP 8.2.2 startup-профиль обязателен, когда включена DEX-раскладка.
// Проверяем файл до конфигурации плагина: обычная release-сборка без профиля
// остаётся валидной, а после генерации/коммита профиль включает оптимизацию.
// При генерации и сборке в CI это две отдельные команды Gradle, поэтому
// повторная конфигурация увидит только что созданный файл.
def hasGeneratedStartupProfile = file('src/main/generated/baselineProfiles/startup-prof.txt').isFile()

baselineProfile {
    // Источник обновляется вручную/в workflow по кнопке: генерация требует устройства.
    saveInSrc = true
    // На AGP 8.2 все варианты объединяются в src/main/generated/baselineProfiles/.
    mergeIntoMain = true
    // Не включаем оптимизацию, пока R8 не получит настоящий startup-prof.txt.
    // Без файла R8 падает на :app:minifyReleaseWithR8 — прогон 45686563422.
    dexLayoutOptimization = hasGeneratedStartupProfile
}

dependencies {
    // ProfileInstaller устанавливает/передаёт ART упакованный профиль при
    // установке APK вне Google Play, в том числе при sideload из GitHub Release.
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'
    baselineProfile project(':baselineprofile')
    // Без сторонних зависимостей в рантайме — минимальный размер APK и мгновенный отклик.
    testImplementation 'junit:junit:4.13.2'
    // F-18: настоящий org.json для JVM-тестов. В APK он не попадает — это
    // testImplementation, а на устройстве работает системная реализация.
    // Без него Audit54Tests (BackupHelper.validateDesktopJson и проверки
    // импорта) приходилось исключать из сборки, то есть самая рискованная
    // часть бэкапа оставалась без регрессии.
    testImplementation 'org.json:json:20240303'
}

tasks.withType(Test).configureEach {
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}
