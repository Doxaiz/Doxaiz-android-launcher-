plugins {
    id 'com.android.application'
}

android {
    namespace 'com.doxaiz.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.doxaiz.launcher"
        minSdk 26
        targetSdk 34
        // Нумерация начата заново с публичного релиза 1.0.0 (было 43 / 6.0-test).
        // versionCode обязан быть меньше следующего релиза и больше нуля;
        // сброс в 1 безопасен, пока публичного релиза не было.
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            // F-20: R8 был отключён без причины. Своей рефлексии по классам лаунчера
            // нет, поэтому сжатие безопасно. Отключить точечно: -PnoMinify
            minifyEnabled !project.hasProperty('noMinify')
            shrinkResources !project.hasProperty('noMinify')
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // BuildConfig нужен, чтобы замеры отзывчивости публиковались только в
    // debug-сборке (debug.doxaiz.filter_ms): в релизе лишний setprop не нужен.
    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        // F-18: наборы проверок из ../tests раньше не запускались ничем.
        test.java.srcDirs += '../tests'
        // Audit54Tests требует настоящий org.json, а в unit-тестах доступна
        // только заглушка из android.jar — его подключаем отдельно, когда появится
        // реализация org.json в тестовом classpath.
        test.java.exclude 'Audit54Tests.java'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // Без сторонних зависимостей в рантайме — минимальный размер APK и мгновенный отклик.
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(Test).configureEach {
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}
