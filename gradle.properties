# Проект не использовал AndroidX: приложение написано на чистом Android API.
# Но baseline/startup-профили (AUDIT §54) требуют androidx.profileinstaller —
# без этого флага AGP падает на :app:checkBenchmarkReleaseAarMetadata с
# «contains AndroidX dependencies, but the android.useAndroidX property is not
# enabled».
android.useAndroidX=true

# Jetifier не нужен: старых support-библиотек в проекте нет, а включение
# заставило бы переписывать байткод всех зависимостей на каждой сборке.
android.enableJetifier=false
