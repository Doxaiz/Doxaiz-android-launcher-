name: Генерация и замер профилей

on:
  workflow_dispatch:
    inputs:
      commit_profile:
        description: "После успешной генерации сохранить профили коммитом в текущую ветку"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: baseline-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-and-benchmark:
    name: Профиль + Macrobenchmark (эмулятор API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Проверить, что профили разрешено сохранять в этой ссылке
        if: ${{ inputs.commit_profile && (github.ref_type != 'branch' || github.ref == 'refs/heads/main') }}
        run: |
          echo "::error title=профиль::commit_profile разрешён только в рабочей ветке; main и теги этим workflow не изменяются"
          exit 1

      - name: Включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Генерация профиля может работать на эмуляторе; результаты замера
      # производительности ниже — только диагностика, не цифры телефона.
      - name: Сгенерировать профили, собрать R8-release и сравнить режимы
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
            -camera-back none -camera-front none
          script: |
            set -euo pipefail

            # mergeIntoMain=true: одна задача, источник — app/src/main/generated/.
            ./gradlew --no-daemon --stacktrace \
              :app:generateBaselineProfile \
              -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=BaselineProfile

            PROFILE_DIR="app/src/main/generated/baselineProfiles"
            BASELINE="$PROFILE_DIR/baseline-prof.txt"
            STARTUP="$PROFILE_DIR/startup-prof.txt"
            test -s "$BASELINE" || { echo "::error title=профиль::не создан $BASELINE"; exit 1; }
            test -s "$STARTUP" || { echo "::error title=профиль::не создан $STARTUP"; exit 1; }
            BASELINE_RULES="$(grep -cvE '^[[:space:]]*(#|$)' "$BASELINE" || true)"
            STARTUP_RULES="$(grep -cvE '^[[:space:]]*(#|$)' "$STARTUP" || true)"
            [ "$BASELINE_RULES" -gt 0 ] || { echo "::error title=профиль::baseline-prof.txt пуст"; exit 1; }
            [ "$STARTUP_RULES" -gt 0 ] || { echo "::error title=профиль::startup-prof.txt пуст"; exit 1; }
            echo "::notice title=профили::baseline: $BASELINE_RULES правил; startup: $STARTUP_RULES правил"

            # Отдельный запуск Gradle перечитывает только что созданный файл;
            # тогда AGP 8.2.2 включает dexLayoutOptimization и R8 проверяет его.
            ./gradlew --no-daemon --stacktrace :app:assembleRelease
            APK="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
            test -n "$APK" && test -f "$APK" || { echo "::error title=R8::release APK не найден"; exit 1; }
            unzip -l "$APK" | grep -q 'assets/dexopt/baseline.prof' \
              || { echo "::error title=R8::в release APK нет assets/dexopt/baseline.prof"; exit 1; }
            echo "::notice title=R8::release APK собран с входным baseline/startup-профилем"

            # EMULATOR переводит ограничение в предупреждение. Числа со
            # SwiftShader не принимаются за производительность на телефоне.
            ./gradlew --no-daemon --stacktrace \
              :baselineprofile:connectedBenchmarkReleaseAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=Macrobenchmark \
              -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR

      - name: Сводка Macrobenchmark
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import json
          import os

          patterns = [
              'baselineprofile/build/outputs/connected_android_test_additional_output/**/*-benchmarkData.json',
              'baselineprofile/build/outputs/connected_android_test_additional_output/*-benchmarkData.json',
          ]
          paths = sorted({p for pattern in patterns for p in glob.glob(pattern, recursive=True)})
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if not paths:
              print('::warning title=Macrobenchmark::JSON-отчёты не найдены; смотрите шаг запуска')
              if summary:
                  with open(summary, 'a', encoding='utf-8') as f:
                      f.write('### Macrobenchmark\n\nJSON-отчёты не найдены; проверяйте шаг запуска.\n')
              raise SystemExit(0)

          rows = []
          for path in paths:
              with open(path, encoding='utf-8') as f:
                  data = json.load(f)
              device = data.get('context', {}).get('build', {}).get('model', 'неизвестное устройство')
              for result in data.get('benchmarks', []):
                  benchmark = result.get('name', 'без имени')
                  for metric, values in result.get('metrics', {}).items():
                      minimum = values.get('minimum')
                      median = values.get('median')
                      maximum = values.get('maximum')
                      if median is None:
                          continue
                      rows.append((benchmark, metric, minimum, median, maximum, device))

          if not rows:
              print('::warning title=Macrobenchmark::JSON есть, измерения не найдены')
          else:
              for benchmark, metric, minimum, median, maximum, device in rows:
                  line = f'{benchmark}: {metric} min={minimum} ms, median={median} ms, max={maximum} ms ({device})'
                  print(f'::notice title=Macrobenchmark::{line[:900]}')

          if summary:
              with open(summary, 'a', encoding='utf-8') as f:
                  f.write('### Macrobenchmark — эмулятор API 34 / SwiftShader\n\n')
                  f.write('Это диагностические значения с эмулятора, не замер на телефоне и не доказательство ускорения.\n\n')
                  if rows:
                      f.write('| Сценарий | Метрика | min, мс | медиана, мс | max, мс | Устройство |\n')
                      f.write('|---|---|---:|---:|---:|---|\n')
                      for benchmark, metric, minimum, median, maximum, device in rows:
                          f.write(f'| {benchmark} | {metric} | {minimum} | {median} | {maximum} | {device} |\n')
                  else:
                      f.write('Измерения не найдены.\n')
          PY

      - name: Сохранить профили и отчёты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-profile-${{ github.run_number }}
          path: |
            app/src/main/generated/baselineProfiles/*.txt
            app/build/outputs/apk/release/*.apk
            baselineprofile/build/outputs/connected_android_test_additional_output/
            baselineprofile/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 14

      - name: Сохранить профили коммитом в текущую ветку
        if: ${{ inputs.commit_profile && github.ref_type == 'branch' && github.ref != 'refs/heads/main' && success() }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/generated/baselineProfiles/baseline-prof.txt \
            app/src/main/generated/baselineProfiles/startup-prof.txt
          if git diff --cached --quiet; then
            echo "::notice title=профиль::генерированные файлы не изменились — коммит не нужен"
            exit 0
          fi
          git commit -m "Сгенерированы baseline и startup профили"
          git push origin "HEAD:${GITHUB_REF}"
