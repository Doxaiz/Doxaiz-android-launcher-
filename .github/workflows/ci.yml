name: Android CI

# Зачем это нужно.
#
# В среде, где ведётся разработка, нет ни Android SDK, ни Java-компилятора, ни
# устройства — сборку APK и запуск лаунчера там сделать нельзя. Этот workflow
# выполняет обе проверки на настоящем Android: компилирует проект Gradle/AGP,
# гоняет JVM-тесты, подписывает debug-APK временным ключом CI и ставит его на
# эмулятор (API 34, 64-bit), после чего снимает реальные кадровые метрики.
#
# Секретов не требуется: используется стандартная debug-подпись AGP (в CI она
# ни для чего не переиспользуется). Release-подпись проекта сюда намеренно не
# подключена — приватный ключ остаётся вне репозитория и вне CI.

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
  workflow_dispatch:

# Группа включает тип события: прогон pull_request и прогон push на main больше
# не могут отменить друг друга. 18.11 два вливания подряд оставили main без
# сборки — прогон на main отменялся через 15–30 с после merge, пока на тот же
# коммит шёл прогон PR. Отмена не считается падением, поэтому релиз молча
# оставался прежним; какие именно шаги не выполнились, видно в /jobs (нулевая
# длительность). Кроме разделения групп:
#   * main вообще не отменяется (cancel-in-progress только для веток) —
#     публикация релиза не должна зависеть от того, что кто-то запушил рядом;
#   * в конце публикации APK скачивается обратно и сверяется по sha256.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unit-tests:
    name: JVM-тесты
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: JVM-тесты
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace test 2>&1 | tee gradle-test.log

      # Логи job читаются не во всех окружениях, а аннотации видны через API,
      # поэтому причину падения выводим аннотациями, а не только в лог.
      - name: Причина падения тестов
        if: failure()
        run: bash .github/scripts/gradle-failure.sh gradle-test.log

      # Причина падения конкретного теста. Без этого в аннотациях видно только
      # «LauncherChecksTest > X FAILED», а текст AssertionError остаётся в логе,
      # который в части окружений недоступен.
      - name: Причина падения теста
        if: failure()
        run: |
          python3 - <<'PYEOF'
          import glob, xml.etree.ElementTree as ET
          def ann(level, title, text):
              text = ' '.join(str(text).split())[:900]
              print("::%s title=%s::%s" % (level, title, text))
          found = False
          for f in glob.glob('app/build/test-results/**/*.xml', recursive=True):
              root = ET.parse(f).getroot()
              for case in root.iter('testcase'):
                  for bad in list(case.findall('failure')) + list(case.findall('error')):
                      found = True
                      msg = (bad.get('message') or '') + ' | ' + (bad.text or '')
                      ann('error', case.get('name') or 'test', msg.strip()[:900])
          if not found:
              ann('warning', 'test-results', 'failure-элементы в XML не найдены — смотрите шаг gradle')
          PYEOF

      - name: Сводка по тестам
        if: always()
        run: |
          python3 - <<'PYEOF'
          import glob, xml.etree.ElementTree as ET, os
          total = fail = err = skip = 0
          for f in glob.glob('app/build/test-results/**/*.xml', recursive=True):
              r = ET.parse(f).getroot()
              total += int(r.get('tests', 0)); fail += int(r.get('failures', 0))
              err += int(r.get('errors', 0)); skip += int(r.get('skipped', 0))
              print(f"{os.path.basename(f)}: tests={r.get('tests')} failures={r.get('failures')} errors={r.get('errors')}")
          print(f"ИТОГО: tests={total} failures={fail} errors={err} skipped={skip}")
          if total == 0:
              print("::error title=JVM-тесты::тесты не найдены — проверки не выполнялись")
          print(f"::notice title=JVM-тесты::tests={total} failures={fail} errors={err} skipped={skip}")
          PYEOF

      - name: Отчёт о тестах
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-report
          path: |
            app/build/reports/tests/
            app/build/test-results/
            gradle-test.log
          if-no-files-found: warn

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Настоящий Android Lint — это не «мой grep», а анализатор Google на
      # несколько сотен проверок: корректность API по уровню SDK, батарея,
      # производительность, доступность, интернационализация, безопасность.
      # Порог сознательно поставлен на error: предупреждения не валят сборку,
      # но полный список печатается аннотациями, чтобы работать по нему.
      - name: Android Lint (ошибки валят сборку)
        run: |
          set -o pipefail
          # textReport + xmlReport: текстовый и машинный отчёты, из которых
          # lint-report.py строит сводку. Ошибки валят задачу сами по себе
          # (abortOnError по умолчанию), скрипт это дублирует аннотацией.
          ./gradlew --no-daemon --stacktrace lintDebug \
            -Pandroid.lint.textReport=true \
            -Pandroid.lint.xmlReport=true 2>&1 | tee gradle-lint.log

      - name: Причина падения Lint
        if: failure()
        run: bash .github/scripts/gradle-failure.sh gradle-lint.log

      - name: Разбор отчёта Lint (сводка и предупреждения)
        if: always()
        run: python3 .github/scripts/lint-report.py

      # GitHub показывает не больше ~10 аннотаций на шаг, поэтому ошибки
      # печатаются отдельным шагом: иначе они вытесняются списком предупреждений.
      - name: Ошибки Lint
        if: always()
        run: python3 .github/scripts/lint-report.py --errors-only

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.txt
            lint-summary.txt
          if-no-files-found: warn


  apk:
    name: Сборка debug-APK
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 30
    # Запись нужна только шагу «Обновить APK в единственном релизе»: по
    # умолчанию GITHUB_TOKEN читает репозиторий и не может менять релизы.
    # Шаг всё равно выполняется только для push в main.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Собрать debug-APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee gradle-build.log

      - name: Причина падения сборки
        if: failure()
        run: bash .github/scripts/gradle-failure.sh gradle-build.log

      - name: Проверить APK (пакет, версия, разрешения, подпись)
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BUILD_TOOLS="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          APK="$(find app/build/outputs/apk/debug -name '*.apk' | head -1)"
          echo "APK: $APK"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | head -5
          echo "--- разрешения ---"
          # 0aapt2 dump permissions поддерживается с build-tools 31+
          "$BUILD_TOOLS/aapt2" dump permissions "$APK" || true
          echo "--- подпись ---"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK" | head -12
          echo "--- sha256 ---"
          sha256sum "$APK" | tee apk-sha256.txt

      # F-20: сборка с включённым R8 проверяется отдельно. Если keep-правила
      # неполные, падает именно этот шаг, а не релиз у пользователя.
      - name: Сборка release с R8 (без подписи)
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee gradle-release.log
          echo "::notice title=R8-release::$(grep -E '^> Task :app:(minify|shrink|package)Release' gradle-release.log | tr '\n' ' ' | cut -c1-600)"

      - name: Причина падения release-сборки
        if: failure()
        run: bash .github/scripts/gradle-failure.sh gradle-release.log

      # Компилируем исходники тестового варианта напрямую. Aggregate assemble
      # у com.android.test может включить connected-задачи генерации профиля;
      # проверка в обычном CI не должна требовать подключённого устройства.
      - name: Скомпилировать генератор и Macrobenchmark без устройства
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :baselineprofile:compileBenchmarkReleaseJavaWithJavac 2>&1 | tee gradle-baselineprofile.log

      - name: Причина падения сборки профилей
        if: failure()
        run: bash .github/scripts/gradle-failure.sh gradle-baselineprofile.log

      - uses: actions/upload-artifact@v4
        with:
          name: doxaiz-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            apk-sha256.txt

      # Публичный релиз живёт по одному тегу и обновляется НА МЕСТЕ: новых
      # тегов не появляется, история не превращается в свалку. Нумерация начата
      # заново с 1.0.0 — прежние тестовые релизы удалены осознанно.
      #
      # Если релиза `v1.0.0` ещё нет, шаг создаёт его из текущего коммита main.
      # Зачем: скачать артефакт CI из некоторых окружений нельзя (хост хранилища
      # артефактов заблокирован), а APK из релиза доступен обычной ссылкой.
      # Условие допускает и ручной запуск (workflow_dispatch) с main: 18.11
      # прогон на main после вливания был отменён на 17-й секунде, релиз
      # остался с прежним APK, и заметить это было нечем. Теперь публикацию
      # можно повторить из вкладки Actions, не делая пустой коммит.
      - name: Опубликовать APK в релизе
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.0.0"
          # Причина падения должна быть в аннотации, а не только в логе:
          # первая попытка упала из-за прав GITHUB_TOKEN (contents: read).
          fail() { echo "::error title=релиз::$1"; exit 1; }
          APK="$(find app/build/outputs/apk/debug -name '*.apk' | head -1)"
          [ -f "$APK" ] || fail "APK не найден в app/build/outputs/apk/debug"
          cp "$APK" doxaiz-1.0.0.apk
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # Первая публикация: создаём тег и релиз из текущего main.
            gh release create "$TAG" doxaiz-1.0.0.apk \
              --target "$GITHUB_SHA" \
              --title "Doxaiz 1.0.0" \
              --notes-file docs/RELEASE_NOTES.md \
              || fail "не удалось создать релиз $TAG"
            echo "::notice title=релиз::создан $TAG"
          else
            echo "::notice title=релиз::релиз $TAG уже есть — обновляю на месте"
            gh release edit "$TAG" --title "Doxaiz 1.0.0" \
              --notes-file docs/RELEASE_NOTES.md \
              || fail "не удалось обновить заметки релиза $TAG"
          fi
          gh release upload "$TAG" doxaiz-1.0.0.apk --clobber \
            || fail "не удалось обновить APK в релизе $TAG"
          gh release upload "$TAG" apk-sha256.txt --clobber || true
          # Видео-обзор экранов лежит в репозитории (docs/), потому что загрузка
          # ассетов из рабочей среды недоступна: хост uploads.github.com не в
          # списке разрешённых. Загружает его CI, у которого доступ есть.
          if [ -f docs/doxaiz-1.0-overview.mp4 ]; then
            gh release upload "$TAG" docs/doxaiz-1.0-overview.mp4 --clobber \
              || fail "не удалось обновить видео в релизе $TAG"
          fi
          echo "::notice title=релиз::APK и видео обновлены в $TAG"

      # Публикация выше заканчивается успехом и тогда, когда до неё не дошло
      # (отменённый прогон) или когда загрузился не тот файл. Поэтому релиз не
      # считается обновлённым, пока скачанный из него APK не совпадёт побайтно
      # с собранным: расхождение sha256 — ошибка, а не молчание.
      - name: Проверить, что в релизе лежит именно этот APK
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.0.0"
          WANT="$(cut -d' ' -f1 apk-sha256.txt)"
          rm -rf /tmp/release-check
          gh release download "$TAG" --pattern doxaiz-1.0.0.apk --dir /tmp/release-check
          GOT="$(sha256sum /tmp/release-check/doxaiz-1.0.0.apk | cut -d' ' -f1)"
          echo "собрано сейчас: $WANT"
          echo "лежит в релизе: $GOT"
          if [ "$WANT" != "$GOT" ]; then
            echo "::error title=релиз::в $TAG лежит другой APK — публикация не применилась, перезапустите workflow"
            exit 1
          fi
          echo "::notice title=релиз::APK в $TAG совпадает с собранным"

      # Тег должен указывать на коммит, из которого собран APK. Иначе скачавший
      # релиз не может понять, какой код внутри: 18.11 тег остался на 4890c04,
      # а APK был пересобран из более позднего main. Релиз один и обновляется на
      # месте — значит, и тег переезжает вместе с ним.
      - name: Сдвинуть тег релиза на опубликованный коммит
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v1.0.0" \
            -f sha="$GITHUB_SHA" -F force=true >/dev/null \
            || { echo "::error title=тег::не удалось сдвинуть v1.0.0 на $GITHUB_SHA"; exit 1; }
          echo "::notice title=тег::v1.0.0 теперь указывает на ${GITHUB_SHA:0:7}"

  emulator:
    name: Запуск на эмуляторе (API 34)
    runs-on: ubuntu-latest
    needs: apk
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Включаем аппаратное ускорение KVM: без него x86_64-эмулятор либо не
      # стартует, либо неприемлемо медленный.
      - name: Включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/download-artifact@v5
        with:
          name: doxaiz-debug-apk
          path: apk

      # Проверки разделены на два прохода намеренно. Аварийный сценарий
      # подкладывает состояние сбоя и уводит фокус на штатный лаунчер, поэтому
      # после него рабочий стол и каталог уже не проверить — в отчёте появлялся
      # аварийный экран вместо лаунчера. Сначала проверяем рабочий стол и
      # каталог на чистом состоянии, затем отдельно — аварийный возврат.
      - name: Эмулятор — рабочий стол и каталог
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: >-
            -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
            -camera-back none -camera-front none
          script: bash .github/scripts/emulator-check.sh
        env:
          APK_PATH: apk
          SKIP_CRASH_SCENARIO: '1'

      - name: Эмулятор — аварийный возврат на штатный лаунчер
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: >-
            -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
            -camera-back none -camera-front none
          script: bash .github/scripts/emulator-check.sh
        env:
          APK_PATH: apk
          ONLY_CRASH_SCENARIO: '1'

      - name: Сохранить отчёты эмулятора
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-report
          path: emulator-report/
          if-no-files-found: warn
